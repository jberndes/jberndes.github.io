---
---
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131512">
  <title>{{ page.title | escape }} – Joakim Berndes</title>
  <meta name="description" content="{{ page.ingress | default: site.description | escape }}">
  <link rel="canonical" href="https://joakimberndes.se{{ page.url }}">
  <style>
    :root {
      --bg: #fafaf8; --panel: #eef1e8; --card: #ffffff; --text: #1d1d1f;
      --muted: #6a6a6f; --line: #e1e4da; --accent: #5e6e4a; --gron: #899a72; --on-accent: #ffffff;
      --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131512; --panel: #1b1f19; --card: #1a1d18; --text: #ededeb;
        --muted: #a6a8a1; --line: #2e332b; --accent: #b3c79a; --gron: #899a72; --on-accent: #10120e;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    header { background: var(--panel); padding: 28px 20px 26px; }
    .inre { max-width: 760px; margin: 0 auto; }
    .tillbaka { display: inline-block; padding: 8px 0; font-size: 0.95rem; color: var(--accent); text-decoration: none; }
    .tillbaka:hover { text-decoration: underline; }
    h1 { font-family: var(--serif); font-weight: 600; font-size: 32px; line-height: 1.2; margin: 14px 0 10px; }
    .ingress { color: var(--muted); font-size: 16px; max-width: 60ch; }
    main { padding: 24px 20px 48px; }
    ol.inlagg { list-style: none; border-top: 1px solid var(--line); }
    ol.inlagg li { display: block; padding: 20px 0; border-bottom: 1px solid var(--line); }
    ol.inlagg h2 { font-family: var(--serif); font-size: 1.25rem; line-height: 1.3; font-weight: 600; margin-bottom: 4px; }
    ol.inlagg h2 a { text-decoration: none; }
    ol.inlagg h2 a:hover { text-decoration: underline; text-decoration-color: var(--gron); text-underline-offset: 3px; }
    .datum { color: var(--muted); font-size: 0.875rem; margin-bottom: 8px; }
    ol.inlagg p { max-width: 65ch; }
    .dold { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
    .hoppa { position: absolute; left: 12px; top: -80px; z-index: 10; background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 3px; text-decoration: none; }
    .hoppa:focus { top: 12px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    main:focus { outline: none; }
    footer { border-top: 1px solid var(--line); padding: 22px 20px 40px; color: var(--muted); font-size: 14px; }
    footer p + p { margin-top: 8px; }
    footer a { color: var(--accent); }
    .datum { color: var(--muted); font-size: 0.875rem; }
    .text { max-width: 65ch; }
    .text > * + * { margin-top: 1em; }
    .text h2 { font-family: var(--serif); font-size: 1.4rem; line-height: 1.3; margin-top: 1.6em; border: 0; padding: 0; text-transform: none; letter-spacing: 0; color: var(--text); }
    .text h3 { font-size: 1.1rem; margin-top: 1.4em; }
    .text ul, .text ol { padding-left: 1.4em; list-style: revert; }
    .text li { display: list-item; border: 0; padding: 2px 0; }
    .text a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .text img { max-width: 100%; height: auto; }
    .text blockquote { border-left: 3px solid var(--gron); padding-left: 1em; color: var(--muted); }
    .text pre { overflow-x: auto; background: var(--panel); padding: 12px; border-radius: 3px; font-size: 0.9rem; }
    .text code { font-size: 0.92em; }
    @media (min-width: 700px) { header { padding: 44px 32px 36px; } main { padding: 32px 32px 56px; } footer { padding: 24px 32px 48px; } h1 { font-size: 40px; } }
  </style>
  {% feed_meta %}
</head>
<body>
  <a class="hoppa" href="#innehall">Hoppa till innehållet</a>
  <header>
    <div class="inre">
      <a class="tillbaka" href="/blogg/"><span aria-hidden="true">&larr;</span> Alla inlägg</a>
      <h1>{{ page.title }}</h1>
      <p class="datum"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y-%m-%d' }}</time></p>
      {% if page.ingress %}<p class="ingress">{{ page.ingress }}</p>{% endif %}
    </div>
  </header>
  <main id="innehall" tabindex="-1">
    <div class="inre">
      <div class="text">
{{ content }}
      </div>
    </div>
  </main>
  <footer>
    <div class="inre">
      <p><a href="/">Joakim Berndes</a> · <a href="/blogg/">Alla inlägg</a> · <a href="/feed.xml">RSS</a></p>
    </div>
  </footer>
</body>
</html>
